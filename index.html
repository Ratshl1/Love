<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love u samya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#9cc4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#9cc4ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#9cc4ff}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;animation:push 90s ease-out forwards}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8) 100%)}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;animation:fo 3.5s ease forwards}
@keyframes fo{to{opacity:0;visibility:hidden}}
#re{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(10,20,50,.5);color:var(--fg);border:1px solid rgba(120,170,255,.45);border-radius:999px;padding:10px 22px;font:15px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity 1.5s;cursor:pointer;z-index:5}
#re.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="fade"></div>
<audio id="bgm" src="Music.mp3" loop preload="auto" playsinline></audio>
<button id="re">↻ إعادة المشاهدة</button>
<script>
'use strict';
/* ---------- constants ---------- */
const FONT="'Pacifico','Brush Script MT','Segoe Script',cursive";
const FLOWER_ALPHA=.42;   // constant flower brightness
const FLOWER_END=30;      // seconds (flower timeline) when drawing is complete
const BT=31;              // butterflies start (global seconds)
const SPREAD=26;          // seconds over which butterflies leave the flower
const MAX_BF=560;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const btn=document.getElementById('re'),fadeEl=document.getElementById('fade');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

/* ---------- background music ---------- */
const bgm=document.getElementById('bgm');
bgm.volume=.6;
function playMusic(){
 if(!bgm.paused)return;
 const p=bgm.play();
 if(p&&p.catch)p.catch(()=>{});
}
// fallback: تشغيل الموسيقى عند أول تفاعل من المستخدم (لمتصفحات التي تمنع التشغيل التلقائي)
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,playMusic,{passive:true}));

let W,H,dpr,S,fh,cx,baseY,bx,by;
let T0,last=0,gen=0,running=false,done=false,endT=0;
let flCv,flCtx,flDone=false;
let bfs=[],sparks=[],dust=[];

/* ---------- butterfly sprites (2 tints x 8 flap frames, glow baked in) ---------- */
const sprites=[[],[]];
[['#e3f1ff','#3a78ff','#7db4ff'],['#eefcff','#27b4ff','#8fe3ff']].forEach((tn,ti)=>{
 for(let i=0;i<8;i++){
  const c=document.createElement('canvas');c.width=c.height=72;
  const g=c.getContext('2d'),k=Math.abs(Math.cos(i*Math.PI/8))*.8+.2;
  g.translate(36,36);g.shadowColor=tn[2];g.shadowBlur=8;
  const gr=g.createLinearGradient(0,0,28,-10);gr.addColorStop(0,tn[0]);gr.addColorStop(1,tn[1]);
  for(const s of[-1,1]){
   g.save();g.scale(s*k,1);g.beginPath();
   g.moveTo(0,-1);g.bezierCurveTo(6,-5,22,-27,29,-15);g.bezierCurveTo(33,-6,18,1,0,2);
   g.moveTo(0,2);g.bezierCurveTo(14,4,26,11,18,22);g.bezierCurveTo(10,28,2,16,0,6);g.closePath();
   g.fillStyle=gr;g.fill();g.lineWidth=1;g.strokeStyle='rgba(225,242,255,.9)';g.stroke();g.restore();
  }
  g.shadowBlur=3;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(0,-9);g.lineTo(0,12);g.stroke();
  sprites[ti].push(c);
 }
});

/* ---------- lily geometry (unit space: base 0,0 ; bloom centre 0,-58) ---------- */
const stemP=new Path2D('M0 0 Q-3 -30 0 -58');
const petals=[[0,34],[-24,33],[24,33],[-55,38],[55,38],[-85,38],[85,38],[-114,34],[114,34]].map(([a,L])=>{
 const w=L*.4,s=a<0?-1:1,X=v=>v*s;
 return{a,L,p:new Path2D(`M0 0 C${X(w*1.25)} ${-L*.2} ${X(w*1.15)} ${-L*.72} ${X(w*.4)} ${-L} C${X(-w*.4)} ${-L*.78} ${X(-w*1.2)} ${-L*.28} 0 0Z`)};
});
const leaves=[[-4,-62,30,3],[-4,58,28,4.5],[-14,-38,26,6.3],[-16,36,25,8],[-26,-28,18,9.8]].map(([y,a,L,t])=>({y,a,L,t,
 p:new Path2D(`M0 0 C7 -8 9 -${L*.65} 2 -${L} C-5 -${L*.6} -7 -8 0 0Z`)}));

function dash(c,path,len,p,col,w,blur){
 c.setLineDash([len,len]);c.lineDashOffset=len*(1-p);c.strokeStyle=col;c.lineWidth=w;
 c.shadowColor='rgba(90,150,255,.9)';c.shadowBlur=blur*dpr;c.stroke(path);c.setLineDash([]);
}
/* draws the flower at full strength into its own layer; the layer is dimmed as a whole */
function drawFlower(c,t){
 c.save();c.lineJoin='round';c.lineCap='round';
 const sp=clamp((t-.7)/7);
 if(sp>0)dash(c,stemP,80,sp,'rgba(150,195,240,.9)',.9,10);
 for(const d of leaves){
  const p=clamp((t-d.t)/4.2);if(p<=0)continue;
  c.save();c.translate(0,d.y);c.rotate(d.a*Math.PI/180);
  const fa=clamp((p-.6)/.4);
  if(fa>0){c.globalAlpha=fa*.85;c.shadowBlur=0;c.fillStyle='rgb(8,30,48)';c.fill(d.p);c.globalAlpha=1}
  dash(c,d.p,d.L*2.4,p,'rgba(110,165,210,.9)',.7,9);
  c.restore();
 }
 petals.forEach((pt,i)=>{
  const p=clamp((t-(9+i*1.6))/4.2);if(p<=0)return;
  c.save();c.translate(0,-58);c.rotate(pt.a*Math.PI/180);
  const fa=clamp((p-.65)/.35);
  if(fa>0){
   const g=c.createLinearGradient(0,0,0,-pt.L);
   g.addColorStop(0,'rgba(240,244,255,.95)');g.addColorStop(1,'rgba(135,165,255,.6)');
   c.globalAlpha=fa*.9;c.shadowColor='rgba(120,170,255,.8)';c.shadowBlur=16*dpr;c.fillStyle=g;c.fill(pt.p);c.globalAlpha=1;
  }
  dash(c,pt.p,pt.L*2.6,p,'rgba(215,230,255,.95)',.7,10);
  if(fa>0){c.globalAlpha=fa*.5;c.shadowBlur=0;c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=.4;c.beginPath();c.moveTo(0,-2);c.lineTo(0,-pt.L*.8);c.stroke()}
  c.restore();
 });
 for(let j=0;j<6;j++){
  const p=clamp((t-(24.5+j*.6))/2.5);if(p<=0)continue;
  const a=(-40+j*16)*Math.PI/180,len=22+(j%2)*4,tx=Math.sin(a)*len*p,ty=-58-Math.cos(a)*len*p;
  c.shadowColor='rgba(255,220,160,.9)';c.shadowBlur=6*dpr;c.strokeStyle='rgba(255,240,215,.9)';c.lineWidth=.5;
  c.beginPath();c.moveTo(0,-58);c.lineTo(tx,ty);c.stroke();
  if(p>.9){c.fillStyle='#ffd9a0';c.beginPath();c.arc(tx,ty,1.1,0,6.3);c.fill()}
 }
 c.restore();
}
function renderFlowerLayer(t){
 flCtx.setTransform(1,0,0,1,0,0);flCtx.clearRect(0,0,flCv.width,flCv.height);
 flCtx.setTransform(dpr,0,0,dpr,0,0);flCtx.translate(cx,baseY);flCtx.scale(S,S);
 drawFlower(flCtx,t);
}

/* ---------- layout ---------- */
function layout(){
 W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 flCv=document.createElement('canvas');flCv.width=cv.width;flCv.height=cv.height;flCtx=flCv.getContext('2d');flDone=false;
 const portrait=H>W*1.05;
 fh=portrait?Math.min(H*.37,W*.95):Math.min(H*.5,W*.6);
 S=fh/94;cx=W/2;baseY=H*.97;bx=cx;by=baseY-58*S;
 dust=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.8),sp:rnd(4,16),ph:rnd(0,6.3)}));
}

/* ---------- text -> butterfly positions (even Poisson-disk sampling of the letter shapes) ---------- */
function buildTargets(){
 const portrait=H>W*1.05;
 // سطر الاسم أكبر ليصبح أوضح
 const lines=portrait?[{t:'I love u',k:1},{t:'SAMYA',k:1.35}]:[{t:'I love u SAMYA',k:1}];
 const top=H*.08,bot=portrait?H*.45:H*.34,rh=bot-top;
 const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
 const kSum=lines.reduce((s,l)=>s+l.k,0);
 let fs=Math.min(rh/(kSum*1.25),230);
 const wOf=(t,k)=>{o.font=`${fs*k}px ${FONT}`;return o.measureText(t).width};
 let mw=0;for(const l of lines)mw=Math.max(mw,wOf(l.t,l.k));
 if(mw>W*.88)fs*=W*.88/mw;
 const lh=lines.map(l=>fs*l.k*1.25);
 const totalH=lh.reduce((a,b)=>a+b,0);
 o.textAlign='center';o.textBaseline='middle';o.fillStyle='#fff';
 let ty=top+rh/2-totalH/2;
 lines.forEach((l,i)=>{o.font=`${fs*l.k}px ${FONT}`;o.fillText(l.t,W/2,ty+lh[i]/2);ty+=lh[i]});
 const img=o.getImageData(0,0,W,H).data;
 const y0=Math.max(0,Math.floor(top-fs)),y1=Math.min(H-1,Math.ceil(bot+fs));
 const cand=[];
 for(let y=y0;y<y1;y+=2)for(let x=0;x<W;x+=2)if(img[(y*W+x)*4+3]>128)cand.push([x,y]);
 for(let i=cand.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]]}
 // مسافة أكبر بين الفراشات = تداخل أقل ووضوح أعلى
 let minD=Math.max(4.5,fs*.08),acc=[];
 for(let it=0;it<16;it++){
  acc=[];const cell=minD,grid=new Map();
  for(const [x,y] of cand){
   const gx=(x/cell)|0,gy=(y/cell)|0;let ok=true;
   for(let a=-1;a<=1&&ok;a++)for(let b=-1;b<=1&&ok;b++){
    const arr=grid.get((gx+a)+','+(gy+b));
    if(arr)for(const q of arr)if((q[0]-x)**2+(q[1]-y)**2<minD*minD){ok=false;break}
   }
   if(ok){acc.push({x,y});const k=gx+','+gy;(grid.get(k)||grid.set(k,[]).get(k)).push([x,y])}
  }
  if(acc.length<=MAX_BF)break;minD*=1.08;
 }
 acc.sort((a,b)=>a.y-b.y||a.x-b.x);
 const size=clamp(minD*1.5,11,26);
 const out=acc.map(p=>({x:p.x,y:p.y,size}));
 // small heart under the text
 const hy=bot+H*(portrait?.06:.06),hs=Math.min(W,H)*.0042;
 for(let i=0;i<36;i++){
  const t=Math.PI/2-i/36*Math.PI*2;
  out.push({x:W/2+16*Math.pow(Math.sin(t),3)*hs,y:hy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*hs,size:size*.8});
 }
 return out;
}
function makeButterflies(targets){
 const n=targets.length;
 bfs=targets.map((p,i)=>({
  sx:bx+rnd(-6,6),sy:by+rnd(-6,6),tx:p.x,ty:p.y,
  c1x:bx+rnd(-1,1)*W*.35,c1y:by-H*rnd(.12,.32),c2x:p.x+rnd(-50,50),c2y:p.y+rnd(40,140),
  t0:BT+.2+(i/n)*SPREAD+rnd(0,.2),dur:rnd(3.6,5.4),size:p.size,ph:rnd(0,6.3),
  tint:Math.random()<.75?0:1,fs:rnd(1.2,2.4),landed:false
 }));
 endT=Math.max(...bfs.map(b=>b.t0+b.dur))+1;
}
function bz(b,e){const m=1-e,a=m*m*m,c=3*m*m*e,d=3*m*e*e,f=e*e*e;
 return[a*b.sx+c*b.c1x+d*b.c2x+f*b.tx,a*b.sy+c*b.c1y+d*b.c2y+f*b.ty]}

/* ---------- main loop ---------- */
function frame(now){
 const T=(now-T0)/1000,dt=Math.min(.05,(now-last)/1000||.016);last=now;
 const tf=T-1;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

 // drifting dust + faint constant bloom haze (additive)
 ctx.globalCompositeOperation='lighter';
 const da=clamp((T-3)/6);
 for(const d of dust){
  d.y-=d.sp*dt;if(d.y<-5){d.y=H+5;d.x=rnd(0,W)}
  ctx.fillStyle=`rgba(130,180,255,${da*(.2+.2*Math.sin(T*1.5+d.ph))})`;
  ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.3);ctx.fill();
 }
 const hz=ctx.createRadialGradient(bx,by,0,bx,by,fh*.8);
 hz.addColorStop(0,`rgba(70,120,230,${.05*clamp(tf/4)})`);hz.addColorStop(1,'rgba(40,80,255,0)');
 ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);

 // flower: always rendered to its own layer, then dimmed once at a constant alpha
 ctx.globalCompositeOperation='source-over';
 if(!flDone&&tf>0){
  if(tf>=FLOWER_END){renderFlowerLayer(99);flDone=true}else renderFlowerLayer(tf);
 }
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=FLOWER_ALPHA;ctx.drawImage(flCv,0,0);
 ctx.setTransform(dpr,0,0,dpr,0,0);

 // butterflies: the only thing that forms the sentence
 for(const b of bfs){
  if(T<b.t0)continue;
  const u=(T-b.t0)/b.dur;let x,y,ang,sz,al,fr;
  if(u<1){
   const e=ease(u),p=bz(b,e),p2=bz(b,Math.min(1,e+.02));
   x=p[0]+Math.sin(T*3+b.ph)*12*u*(1-u)*4;y=p[1];
   ang=Math.atan2(p2[1]-p[1],p2[0]-p[0])+Math.PI/2;
   sz=b.size*(.3+.7*Math.min(1,u*5));al=Math.min(1,u*6);fr=Math.floor(T*20+b.ph*3)%8;
   if(Math.random()<.12&&sparks.length<400)sparks.push({x,y,vx:rnd(-8,8),vy:rnd(-8,8),l:0,m:rnd(.6,1.2)});
  }else{
   if(!b.landed){b.landed=true;for(let k=0;k<2&&sparks.length<400;k++)sparks.push({x:b.tx,y:b.ty,vx:rnd(-20,20),vy:rnd(-20,20),l:0,m:rnd(.8,1.4)})}
   x=b.tx+Math.sin(T*1.1+b.ph)*.7;y=b.ty+Math.cos(T*.9+b.ph)*.7;
   ang=Math.sin(T*.7+b.ph)*.1;sz=b.size;al=.95;
   fr=Math.floor((.5+.5*Math.sin(T*b.fs*2+b.ph))*3);
  }
  ctx.globalAlpha=al;ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.drawImage(sprites[b.tint][fr],-sz/2,-sz/2,sz,sz);ctx.restore();
 }
 // sparks
 ctx.globalCompositeOperation='lighter';
 for(let i=sparks.length-1;i>=0;i--){
  const s=sparks[i];s.l+=dt;if(s.l>s.m){sparks.splice(i,1);continue}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  ctx.globalAlpha=1-s.l/s.m;ctx.fillStyle='rgb(160,205,255)';ctx.beginPath();ctx.arc(s.x,s.y,1.2,0,6.3);ctx.fill();
 }
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 if(!done&&endT&&T>endT){done=true;btn.classList.add('on')}
 requestAnimationFrame(frame);
}

/* ---------- start / replay / resize ---------- */
function start(){
 const g=++gen;
 layout();bfs=[];sparks=[];done=false;endT=0;btn.classList.remove('on');
 fadeEl.style.animation='none';void fadeEl.offsetWidth;fadeEl.style.animation='';
 cv.style.animation='none';void cv.offsetWidth;cv.style.animation='';
 T0=performance.now();last=T0;
 playMusic();
 const fontReady=(document.fonts&&document.fonts.load)
  ?Promise.race([document.fonts.load('100px "Pacifico"','I love u SAMYA'),new Promise(r=>setTimeout(r,3000))]):Promise.resolve();
 fontReady.catch(()=>{}).then(()=>{if(g===gen)makeButterflies(buildTargets())});
 if(!running){running=true;requestAnimationFrame(frame)}
}
btn.addEventListener('click',start);
let lw=innerWidth,lh=innerHeight,rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
 if(Math.abs(innerWidth-lw)>80||(innerWidth>innerHeight)!==(lw>lh)){lw=innerWidth;lh=innerHeight;start()}
},300)});
start();
</script>
</body>
</html>
