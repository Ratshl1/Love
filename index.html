


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03040a">
<title>For Samya | A Little Universe of Love</title>

<style>
:root {
  --night: #03040a;
  --blue: #48cfff;
  --white: #f4f6ff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--night);
}

body {
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
}

#universe {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 28%,
      rgba(34, 54, 100, .17), transparent 42%),
    radial-gradient(ellipse at 50% 90%,
      rgba(0, 94, 170, .10), transparent 45%),
    #03040a;
}

#stars, #butterflies {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#stars { z-index: 0; }
#butterflies { z-index: 3; }

.eyebrow {
  position: absolute;
  z-index: 2;
  top: 4.5%;
  left: 0;
  width: 100%;
  text-align: center;
  font: 9px/1.5 Arial, sans-serif;
  letter-spacing: .42em;
  color: #8799c3;
  opacity: 0;
  animation: fadeIn 2s 1s forwards;
}

.scene {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.flower-wrap {
  position: absolute;
  top: 8%;
  width: min(88vw, 450px);
  height: 52%;
  max-height: 470px;
  display: grid;
  place-items: center;
  transform-origin: 50% 40%;
  animation: flowerBreath 5s ease-in-out 4s infinite;
}

#lily {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 15px rgba(174, 207, 255, .13));
}

.petals path,
.leaves path,
.stem,
.veins path,
.stamen path {
  fill: none;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: drawLine 2.8s cubic-bezier(.5,0,.3,1) forwards;
}

.petals path {
  stroke: #edf4ff;
  stroke-width: 1.35;
  stroke-linecap: round;
}

.petals .inner {
  stroke: #9bb8e8;
  stroke-width: .8;
  animation-delay: .7s;
}

.petals .fill {
  fill: url(#petalFill);
  stroke: #dbe8ff;
  stroke-width: 1.1;
  opacity: 0;
  animation:
    drawLine 2.8s cubic-bezier(.5,0,.3,1) forwards,
    petalBloom 1.7s ease 2.4s forwards;
}

.leaves path {
  stroke: #547c70;
  stroke-width: 1.5;
  animation-delay: 1.7s;
}

.stem {
  stroke: #577e6c;
  stroke-width: 2.2;
  animation-delay: 1.2s;
}

.veins path {
  stroke: #80a68b;
  stroke-width: .7;
  animation-delay: 2s;
}

.stamen path {
  stroke: #dfc783;
  stroke-width: 1.2;
  animation-delay: 2s;
}

.anther {
  fill: #d8b568;
  opacity: 0;
  animation: antherGlow .7s ease 3s forwards;
}

.pollen {
  fill: #fff0b7;
  opacity: 0;
  animation: antherGlow 1s ease 3.3s forwards;
}

#flowerGlow {
  opacity: 0;
  animation: flowerLight 2.5s ease 3s forwards;
}

.message-area {
  position: absolute;
  top: 65%;
  left: 0;
  width: 100%;
  height: 20%;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
}

.message-area::before {
  content: "";
  position: absolute;
  width: 85%;
  height: 65%;
  background: radial-gradient(ellipse,
    rgba(16, 92, 185, .09), transparent 70%);
  filter: blur(20px);
}

.footer {
  position: absolute;
  bottom: 4%;
  left: 0;
  width: 100%;
  z-index: 4;
  text-align: center;
  font: 9px/1.8 Arial, sans-serif;
  letter-spacing: .35em;
  color: #627697;
  opacity: 0;
  animation: fadeIn 2s 7s forwards;
}

.footer span {
  display: block;
  margin-top: 3px;
  font: 11px Georgia, serif;
  letter-spacing: .15em;
  color: #8ba6d5;
}

@keyframes drawLine {
  to { stroke-dashoffset: 0; }
}

@keyframes petalBloom {
  to { opacity: 1; }
}

@keyframes antherGlow {
  to { opacity: 1; }
}

@keyframes flowerLight {
  0% { opacity: 0; }
  100% { opacity: .9; }
}

@keyframes flowerBreath {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.018); }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@media (max-height: 650px) {
  .flower-wrap {
    top: 5%;
    height: 50%;
  }

  .message-area {
    top: 62%;
    height: 24%;
  }

  .footer { bottom: 2%; }
}

@media (prefers-reduced-motion: reduce) {
  .flower-wrap { animation: none; }
}
</style>
</head>

<body>
<main id="universe">
  <canvas id="stars"></canvas>
  <canvas id="butterflies"></canvas>

  <div class="eyebrow">A LITTLE MAGIC, JUST FOR YOU</div>

  <div class="scene">
    <div class="flower-wrap">
      <svg id="lily" viewBox="0 0 360 420"
           xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="A white lily flower">
        <defs>
          <linearGradient id="petalFill"
            x1="0" y1="0" x2="1" y2="1">

          <radialGradient id="heart">

          <radialGradient id="aura">

        <ellipse id="flowerGlow" cx="180" cy="155"

        <!-- Stem -->

          d="M180 210 C177 270 186 330 177 409"/>

        <!-- Leaves -->

                   C119 353 153 345 179 325Z"/>

                   C247 377 211 373 181 359Z"/>
        </g>

        <g class="veins">
          <path d="M178 326 Q133 320 88 340"/>
          <path d="M183 359 Q232 345 274 356"/>
        </g>

        <!-- Six curved lily petals -->
        <g class="petals">
          <!-- Back petals -->
          <path class="fill"
            style="animation-delay:.1s"
            d="M180 187
               C153 145 89 107 105 48
               C113 17 145 22 163 60
               C180 95 182 146 180 187Z"/>

          <path class="fill"
            style="animation-delay:.35s"
            d="M180 187
               C188 130 212 54 255 42
               C288 34 292 72 268 104
               C244 139 208 165 180 187Z"/>

          <path class="fill"
            style="animation-delay:.6s"
            d="M180 187
               C219 160 286 148 309 181
               C329 211 293 229 258 224
               C223 220 196 203 180 187Z"/>

          <!-- Front petals -->
          <path class="fill"
            style="animation-delay:.85s"
            d="M180 187
               C218 204 251 251 230 292
               C214 322 185 301 179 268
               C173 239 176 208 180 187Z"/>

          <path class="fill"
            style="animation-delay:1.1s"
            d="M180 187
               C162 229 137 286 99 278
               C62 270 76 232 105 210
               C132 190 159 183 180 187Z"/>

          <path class="fill"
            style="animation-delay:1.35s"
            d="M180 187
               C144 180 83 184 61 151
               C43 123 73 100 107 123
               C138 143 163 165 180 187Z"/>

          <!-- Fine petal contours -->
          <path d="M180 186 Q156 102 120 45"/>
          <path d="M182 185 Q209 92 263 53"/>
          <path d="M184 189 Q258 168 303 188"/>
          <path d="M180 192 Q209 259 221 290"/>
          <path d="M177 192 Q129 244 92 265"/>
          <path d="M177 185 Q111 151 66 130"/>

          <!-- Delicate central veins -->
          <path class="inner" d="M174 180 Q145 114 127 73"/>
          <path class="inner" d="M186 179 Q213 104 250 69"/>
          <path class="inner" d="M191 189 Q254 181 284 191"/>
          <path class="inner" d="M181 200 Q201 245 214 272"/>
          <path class="inner" d="M169 193 Q127 229 102 251"/>
          <path class="inner" d="M169 180 Q113 148 82 132"/>
        </g>

        <!-- Stamens and golden anthers -->
        <g class="stamen">
          <path d="M177 192 Q149 155 126 145"/>
          <path d="M179 191 Q163 148 154 127"/>
          <path d="M181 191 Q179 148 180 122"/>
          <path d="M183 191 Q197 151 207 132"/>
          <path d="M185 193 Q218 160 235 154"/>
          <path d="M187 194 Q224 182 249 181"/>
        </g>

        <g>
          <ellipse class="anther" cx="123" cy="143"
            rx="5" ry="10" transform="rotate(-45 123 143)"/>
          <ellipse class="anther" cx="153" cy="125"
            rx="4.5" ry="9" transform="rotate(-20 153 125)"/>
          <ellipse class="anther" cx="180" cy="119"
            rx="4.5" ry="9"/>
          <ellipse class="anther" cx="209" cy="130"
            rx="4.5" ry="9" transform="rotate(25 209 130)"/>
          <ellipse class="anther" cx="237" cy="151"
            rx="5" ry="10" transform="rotate(45 237 151)"/>
          <ellipse class="anther" cx="250" cy="180"
            rx="4.5" ry="9" transform="rotate(70 250 180)"/>

          <circle class="pollen" cx="123" cy="143" r="2"/>
          <circle class="pollen" cx="153" cy="125" r="2"/>
          <circle class="pollen" cx="180" cy="119" r="2"/>
          <circle class="pollen" cx="209" cy="130" r="2"/>
          <circle class="pollen" cx="237" cy="151" r="2"/>
          <circle class="pollen" cx="250" cy="180" r="2"/>
        </g>

        <circle cx="180" cy="190" r="5"
          fill="url(#heart)" opacity=".9"/>
      </svg>
    </div>
  </div>

  <div class="message-area" aria-label="I love u samya"></div>

  <div class="footer">
    SOME THINGS ARE TOO BEAUTIFUL FOR WORDS
    <span>for Samya, with love ♡</span>
  </div>
</main>

<script>
(() => {
  const starCanvas = document.getElementById("stars");
  const canvas = document.getElementById("butterflies");
  const ctx = canvas.getContext("2d");
  const sctx = starCanvas.getContext("2d");
  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let W = 0, H = 0, DPR = 1;
  let butterflies = [];
  let targets = [];
  let stars = [];
  let started = false;
  let startTime = 0;
  let lastTime = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t * t * (3 - 2 * t);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    for (const c of [canvas, starCanvas]) {
      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.style.width = W + "px";
      c.style.height = H + "px";
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    createStars();
    makeTargets();
    makeButterflies();
  }

  function createStars() {
    stars = Array.from({ length: Math.min(100, Math.round(W / 4)) },
      () => ({
        x: rand(0, W),
        y: rand(0, H),
        r: rand(.3, 1.3),
        a: rand(.12, .65),
        phase: rand(0, 6.28)
      }));
  }

  function drawStars(time) {
    sctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      const pulse = .72 + .28 * Math.sin(time * .0007 + s.phase);
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fillStyle = `rgba(171,204,255,${s.a * pulse})`;
      sctx.fill();
    }
  }

  // Render the exact phrase to an offscreen canvas.
  // Each butterfly receives a target point from the letter shapes.
  function makeTargets() {
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    const maxWidth = Math.min(W * .91, 680);
    const fontSize = Math.min(65, W * .112);
    const font = `italic ${fontSize}px Georgia, serif`;

    octx.font = font;
    const phrase = "I love u samya";
    const measured = octx.measureText(phrase).width;
    const scale = Math.min(1, maxWidth / measured);
    const actualSize = fontSize * scale;

    off.width = Math.ceil(maxWidth * 1.1);
    off.height = Math.ceil(actualSize * 2.1);

    octx.font = `italic ${actualSize}px Georgia, serif`;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillStyle = "#ffffff";
    octx.fillText(phrase, off.width / 2, off.height / 2);

    const image = octx.getImageData(0, 0, off.width, off.height);
    const points = [];
    const step = W < 430 ? 4 : 5;

    for (let y = 0; y < off.height; y += step) {
      for (let x = 0; x < off.width; x += step) {
        const alpha = image.data[(y * off.width + x) * 4 + 3];

        if (alpha > 100 && Math.random() < .85) {
          points.push({
            x: W / 2 + (x - off.width / 2),
            y: H * .755 + (y - off.height / 2),
          });
        }
      }
    }

    // Keep a manageable number of particles on mobile.
    const count = Math.min(points.length, W < 430 ? 460 : 720);
    targets = [];

    for (let i = 0; i < count; i++) {
      targets.push(points[Math.floor(i * points.length / count)]);
    }

    // Randomize target assignment to avoid obvious left-to-right streams.
    for (let i = targets.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [targets[i], targets[j]] = [targets[j], targets[i]];
    }
  }

  function flowerOrigin() {
    const rect = document.getElementById("lily").getBoundingClientRect();

    return {
      x: rect.left + rect.width * .5,
      y: rect.top + rect.height * .46
    };
  }

  function makeButterflies() {
    const origin = flowerOrigin();

    butterflies = targets.map((target, i) => ({
      x: origin.x + rand(-24, 24),
      y: origin.y + rand(-20, 20),
      startX: origin.x + rand(-24, 24),
      startY: origin.y + rand(-20, 20),
      targetX: target.x,
      targetY: target.y,
      delay: rand(0, 1.3),
      phase: rand(0, Math.PI * 2),
      size: rand(2.6, 4.5),
      drift: rand(7, 24),
      speed: rand(.8, 1.3),
      angle: rand(-.3, .3)
    }));
  }

  function drawButterfly(x, y, size, angle, phase, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = opacity;

    const flap = Math.sin(phase) * .65;
    const wing = size;

    ctx.shadowBlur = size * 3.5;
    ctx.shadowColor = "#27aaff";

    // Left and right wings.
    ctx.fillStyle = "#49caff";
    ctx.beginPath();
    ctx.ellipse(-wing * .62, -wing * .15,
      wing * .65, wing * (.95 + flap * .28),
      -.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(wing * .62, -wing * .15,
      wing * .65, wing * (.95 - flap * .28),
      .4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#a8edff";
    ctx.beginPath();
    ctx.ellipse(0, 0, size * .16, size * .85, 0,
      0, Math.PI * 2);
    ctx.fill();

    // Tiny antennae.
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(177,235,255,.8)";
    ctx.lineWidth = .45;
    ctx.beginPath();
    ctx.moveTo(0, -size * .5);
    ctx.lineTo(-size * .5, -size);
    ctx.moveTo(0, -size * .5);
    ctx.lineTo(size * .5, -size);
    ctx.stroke();

    ctx.restore();
  }

  function drawFrame(time) {
    ctx.clearRect(0, 0, W, H);
    drawStars(time);

    const origin = flowerOrigin();
    const elapsed = (time - startTime) / 1000;
    const launchDelay = 3.8;

    butterflies.forEach((b, i) => {
      const t = clamp((elapsed - launchDelay - b.delay) / 2.7, 0, 1);
      const e = ease(t);

      // A graceful arc from the flower to the final letter.
      const arc = Math.sin(e * Math.PI) * b.drift;

      const x = b.startX + (b.targetX - b.startX) * e;
      const y = b.startY + (b.targetY - b.startY) * e - arc;

      const floating = t >= 1
        ? Math.sin(time * .0015 + b.phase) * 1.5
        : 0;

      const opacity = t < 1
        ? clamp((elapsed - launchDelay - b.delay) / .35, 0, 1)
        : .94;

      drawButterfly(
        x + floating,
        y + floating * .6,
        b.size,
        b.angle + Math.sin(time * .001 + b.phase) * .12,
        time * .009 * b.speed + b.phase,
        opacity
      );
    });

    // A few free-flying butterflies around the flower.
    if (elapsed > 3 && elapsed < 10) {
      for (let i = 0; i < 7; i++) {
        const phase = time * .00065 + i * 1.8;
        const x = origin.x + Math.sin(phase * 1.2) * (25 + i * 7);
        const y = origin.y + Math.cos(phase) * (12 + i * 8);

        drawButterfly(x, y, 3.5, Math.sin(phase) * .5,
          time * .012 + i, .8);
      }
    }

    requestAnimationFrame(drawFrame);
  }

  function init() {
    resize();
    startTime = performance.now();
    started = true;
    requestAnimationFrame(drawFrame);
  }

  window.addEventListener("resize", () => {
    resize();
  });

  window.addEventListener("load", init);
})();
</script>
</body>
</html>
