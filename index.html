
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Samya 💙</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  width: 100%;
  height: 100svh;
  overflow: hidden;
  background: #020207;
  color: white;
  font-family: Georgia, serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flower {
  width: min(88vw, 430px);
  height: 57%;
  margin-top: 2vh;
  overflow: visible;
  filter: drop-shadow(0 0 12px #b9d9ff33);
}

.petal {
  fill: url(#petal);
  stroke: #e8f4ff;
  stroke-width: 1.4;
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
  animation: draw 2.5s ease forwards;
}

.petal:nth-of-type(2) { animation-delay: .3s; }
.petal:nth-of-type(3) { animation-delay: .6s; }
.petal:nth-of-type(4) { animation-delay: .9s; }
.petal:nth-of-type(5) { animation-delay: 1.2s; }
.petal:nth-of-type(6) { animation-delay: 1.5s; }
.petal:nth-of-type(7) { animation-delay: 1.8s; }

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

.center {
  fill: #e8d7a0;
  opacity: 0;
  animation: glow 1.5s ease 2.5s forwards;
}

@keyframes glow {
  to {
    opacity: 1;
    filter: drop-shadow(0 0 12px #fff1b0);
  }
}

.butterfly {
  position: absolute;
  top: 30%;
  left: 50%;
  font-size: 25px;
  color: #53cfff;
  opacity: 0;
  z-index: 2;
  filter: drop-shadow(0 0 8px #168cff);
  animation: fly 3s ease-in-out forwards;
  animation-delay: 3.3s;
}

.butterfly:nth-child(2) { --x: -34vw; --y: 43vh; }
.butterfly:nth-child(3) { --x: -24vw; --y: 48vh; }
.butterfly:nth-child(4) { --x: -14vw; --y: 42vh; }
.butterfly:nth-child(5) { --x: -4vw;  --y: 47vh; }
.butterfly:nth-child(6) { --x: 6vw;   --y: 42vh; }
.butterfly:nth-child(7) { --x: 16vw;  --y: 47vh; }
.butterfly:nth-child(8) { --x: 26vw;  --y: 42vh; }
.butterfly:nth-child(9) { --x: 34vw;  --y: 47vh; }

@keyframes fly {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) rotate(-20deg) scale(.3);
  }
  25% {
    opacity: 1;
  }
  75% {
    opacity: 1;
  }
  100% {
    opacity: 1;
    transform: translate(var(--x), var(--y)) rotate(10deg) scale(1);
  }
}

.message {
  position: absolute;
  bottom: 11%;
  width: 100%;
  text-align: center;
  font-size: clamp(27px, 7vw, 48px);
  letter-spacing: 2px;
  color: #8bdfff;
  text-shadow: 0 0 12px #148cff, 0 0 35px #1264ff;
  opacity: 0;
  animation: appear 2s ease 5.7s forwards;
}

.message span {
  display: inline-block;
  animation: heartbeat 2s ease-in-out infinite;
  animation-delay: 7.7s;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

.subtitle {
  position: absolute;
  bottom: 5%;
  color: #73859f;
  font-size: 11px;
  letter-spacing: 4px;
  opacity: 0;
  animation: appear 2s ease 6.5s forwards;
}
</style>
</head>

<body>
<div class="scene">

  <svg class="flower" viewBox="0 0 300 340"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="45%" stop-color="#d9e9ff"/>
        <stop offset="100%" stop-color="#879dc8"/>
      </linearGradient>
    </defs>

    <g transform="translate(150 150)">
      <path class="petal"
        d="M0 0 C-65 -35 -95 -115 -35 -145 C5 -115 12 -45 0 0Z"/>
      <path class="petal"
        d="M0 0 C-10 -65 5 -140 48 -145 C78 -92 38 -30 0 0Z"/>
      <path class="petal"
        d="M0 0 C35 -65 90 -100 118 -65 C110 -15 45 12 0 0Z"/>
      <path class="petal"
        d="M0 0 C70 -5 112 30 95 68 C48 78 8 36 0 0Z"/>
      <path class="petal"
        d="M0 0 C45 45 45 110 5 132 C-38 97 -30 35 0 0Z"/>
      <path class="petal"
        d="M0 0 C-28 55 -83 76 -111 42 C-105 0 -45 -20 0 0Z"/>
      <path class="petal"
        d="M0 0 C-58 2 -100 -36 -83 -78 C-38 -82 -8 -35 0 0Z"/>

      <g class="center">
        <circle r="9"/>
        <g stroke="#f8e9b6" stroke-width="2">
          <path d="M0 -8 L0 -27"/>
          <path d="M5 -6 L17 -22"/>
          <path d="M8 0 L28 -4"/>
          <path d="M5 6 L21 18"/>
          <path d="M-5 6 L-19 19"/>
          <path d="M-8 0 L-27 3"/>
          <path d="M-5 -6 L-18 -20"/>
        </g>
      </g>
    </g>

    <path d="M150 280 Q145 315 153 340"
      stroke="#537d69" stroke-width="3" fill="none"/>
  </svg>

  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>
  <div class="butterfly">🦋</div>

  <div class="message">
    <span>I love u samya 💙</span>
  </div>

  <div class="subtitle">MADE WITH LOVE</div>
</div>
</body>
</html>
